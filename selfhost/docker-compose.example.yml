services:
  lampa:
    image: ghcr.io/casualsharper/lampa-home:latest
    container_name: lampa
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TORRSERVER=NAS_IP:8090
    ports:
      - 8080:8080
    volumes:
      - /volume1/docker/lampa:/srv/lampa:ro
      - /volume1/docker/lampa/data:/data

name: Build image

# Publishes ghcr.io/<owner>/lampa-home: Python + ffmpeg runtime for selfhost/server.py.
# Weekly rebuild picks up Alpine and ffmpeg security updates.
on:
  push:
    branches: [home]
    paths: ['selfhost/Dockerfile', '.github/workflows/image.yml']
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: selfhost
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lampa-home:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
